services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-this-password}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
  api:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data
      - model_cache:/root/.cache
    depends_on:
      - neo4j
      - chroma
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - app_data:/app/data
      - model_cache:/root/.cache
    depends_on:
      - neo4j
      - chroma
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
volumes:
  neo4j_data:
  chroma_data:
  app_data:
  model_cache:

